<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nous joindre | RÉEL</title>
  <meta name="description" content="Découvrez l'histoire, la mission et les valeurs du Regroupement des Étudiants Entrepreneurs de l'Université Laval (RÉEL). Depuis 2000, nous connectons les étudiants aux ressources et opportunités entrepreneuriales.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ══════════════════════════════════════════
     HEADER / NAVBAR
══════════════════════════════════════════ -->
<div id="header"></div>

<!-- ══════════════════════════════════════════
     PAGE CONTACT
══════════════════════════════════════════ -->
<main>
<div id="page-contact" class="page">
  <div class="page-hero">
    <div class="page-hero-inner">
      <div class="section-label">Contact</div>
      <h1 class="page-titre">Nous joindre.</h1>
    </div>
  </div>

  <section>
    <div class="contact-inner">
      <div class="contact-grid">
        <div class="contact-info">
          <div class="section-label">Coordonnées</div>
          <h2 class="section-titre">On veut avoir de vos nouvelles</h2>
          <p class="section-desc">Que vous ayez une question, une opportunité de partenariat ou simplement envie d'en savoir plus sur le RÉEL, n'hésitez pas à nous écrire.</p>
          <div class="contact-detail">
            <div class="contact-detail-icon">📧</div>
            <div class="contact-detail-text">
              <a href="mailto:info@reelul.ca">info@reelul.ca</a>
            </div>
          </div>
          <div class="contact-detail">
            <div class="contact-detail-icon">📍</div>
            <div class="contact-detail-text">
              <span>Université Laval, Québec (QC)</span>
            </div>
          </div>
          <div class="contact-detail">
            <div class="contact-detail-icon">📸</div>
            <div class="contact-detail-text">
              <a href="https://www.instagram.com/reelul/" target="_blank">@reelul sur Instagram</a>
            </div>
          </div>
          <div class="contact-detail">
            <div class="contact-detail-icon">💼</div>
            <div class="contact-detail-text">
              <a href="https://www.linkedin.com/company/regroupement-des-%C3%A9tudiants-entrepreneurs-de-l'universit%C3%A9-laval-r%C3%A9el-/" target="_blank">LinkedIn · RÉEL</a>
            </div>
          </div>
        </div>
        <div class="contact-form">
          <div class="form-group">
            <label>Nom complet</label>
            <input type="text" placeholder="Marie Tremblay" />
          </div>
          <div class="form-group">
            <label>Adresse courriel</label>
            <input type="email" placeholder="marie@exemple.com" />
          </div>
          <div class="form-group">
            <label>Sujet</label>
            <input type="text" placeholder="Partenariat, question, info..." />
          </div>
          <div class="form-group">
            <label>Message</label>
            <textarea placeholder="Votre message ici..."></textarea>
          </div>
          <button class="form-submit">Envoyer le message →</button>
        </div>
      </div>
    </div>
  </section>
</div><!-- /page-contact -->
</main>

<!-- ══════════════════════════════════════════
     FOOTER
══════════════════════════════════════════ -->
<div id="footer"></div>

<script src="script.js"></script>
</body>
</html>
